<svg  class="symbol state-speaking"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" color="#e14b4b" role="img" aria-label="Sigilo Todd"><style>
.geometry{fill:none;stroke:currentColor;stroke-width:1.15;vector-effect:non-scaling-stroke}
.faint{opacity:.23}.mid{opacity:.52}.strong{opacity:.9}.center{fill:currentColor}
.outer,.inner{transform-box:view-box;transform-origin:100px 100px}
@keyframes turnOuter{to{transform:rotate(360deg)}}
@keyframes idleBreath{0%,100%{opacity:.83}50%{opacity:1}}
@keyframes voiceFade{0%,100%{opacity:.30}12%{opacity:.95}23%{opacity:.48}37%{opacity:1}48%{opacity:.36}62%{opacity:.90}73%{opacity:.53}85%{opacity:.98}94%{opacity:.42}}
@keyframes voiceDot{0%,100%{opacity:.25}15%{opacity:.97}29%{opacity:.40}42%{opacity:.95}57%{opacity:.38}68%{opacity:1}82%{opacity:.48}92%{opacity:.90}}
.state-idle .inner{animation:idleBreath 4s ease-in-out infinite}
.state-thinking .outer{animation:turnOuter 16s linear infinite}
.state-speaking .inner{animation:voiceFade 2.8s ease-in-out infinite}
.state-speaking .center{animation:voiceDot 2.1s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><g class="geometry"><g class="outer mid"><circle cx="100" cy="100" r="76"/><path d="M100 14V29M100 171V186M14 100H29M171 100H186"/><path d="M100 18 110 34 90 34Z M100 182 110 166 90 166Z"/></g><g class="inner strong"><path d="M45 45H155V155H45Z"/><path d="M100 24 157 100 100 176 43 100Z"/><circle cx="100" cy="100" r="47"/><path d="M100 53V67M100 133V147M53 100H67M133 100H147"/></g><circle class="mid" cx="100" cy="100" r="18"/><circle class="center" cx="100" cy="100" r="5"/></g></svg>